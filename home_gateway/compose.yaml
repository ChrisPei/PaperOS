services:
  metrics:
    image: ugreen/home-assistant:2026.8.3
    entrypoint: ["python3", "-u", "/data/gateway.py"]
    # NAS shared-folder ACLs recognize its ordinary app UID/GID.
    # The container still receives only this one directory, mounted read-only.
    user: "1000:10"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "192.0.2.10:8787:8787/tcp"
    volumes:
      - /volume1/docker/paperos-readonly:/data:ro
    restart: unless-stopped
